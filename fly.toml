# Fly.io config for the Haptune server (server/ + engine/). Deployed by .github/workflows/server.yml
# once the FLY_API_TOKEN secret is set. Change `app` if the name is taken; the app's address then becomes
# https://<app>.fly.dev - put that in the repository variable HAPTUNE_SERVER_URL so both apps use it.
app = "haptune-lok"
primary_region = "sin"            # Singapore: closest region to Malaysia

[build]
  dockerfile = "server/Dockerfile"

[env]
  HAPTUNE_DATA = "/data"           # Academy database (SQLite) lives on the volume below
  HAPTUNE_WORKERS = "1"
  # The website. Card payments (Stripe) come back to it, and the server's own address points people to it.
  HAPTUNE_SITE_URL = "https://haptune.name.my"
  HAPTUNE_WEB_URL = "https://haptune.name.my/"
  # DuitNow / bank transfer details shown to people in Malaysia (the account name is optional but reassuring):
  HAPTUNE_PAY_BANK = "CIMB Bank"
  HAPTUNE_PAY_ACCOUNT = "7647680094"
  # HAPTUNE_PAY_NAME = "<the name on the bank account>"
  # Secrets, set with `fly secrets set`: STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET (card payments)
  # Which Claude model each AI feature uses (the plans' allowances follow their cost, see server/accounts.py).
  # Short tutor answers: Haiku costs 1/40 of Opus per token. The song finder needs web search: Sonnet, half the price.
  HAPTUNE_AI_MODEL_TUTOR = "claude-haiku-5-5"
  HAPTUNE_AI_MODEL_FIND = "claude-sonnet-5-5"
  # Reading sheet music stays on Opus (accuracy measured in the README) until engine/tools/model_bench.py
  # (GitHub Actions > ai-bench) shows a cheaper set-up reads as well. For example, Haiku reads every line and
  # Opus re-reads only the doubtful bars (Plus then covers about 11 pages a month instead of 2):
  # HAPTUNE_AI_MODEL_READ = "claude-haiku-5-5"
  # HAPTUNE_AI_MODEL_REREAD = "claude-opus-5-5"

[[mounts]]
  source = "haptune_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"      # sleeps when idle, wakes on the next request
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "10s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"                   # band split needs this; AI reading and the Academy run in far less
