# Builds the Android app (web/ wrapped with Capacitor) on every push that touches web/.
#
#   * Haptune.apk  - install it on your own phone to test (Settings may ask you to allow installing from
#                    your browser or Files app). It is also published as the release "android-test", so the
#                    newest build is always at:
#                    https://github.com/<owner>/<repo>/releases/download/android-test/Haptune.apk
#   * Haptune.aab  - the file you upload to Google Play. Built and signed only when the four signing secrets
#                    exist (see web/ANDROID.md): HAPTUNE_KEYSTORE_BASE64, HAPTUNE_KEYSTORE_PASSWORD,
#                    HAPTUNE_KEY_ALIAS, HAPTUNE_KEY_PASSWORD.
# Repository variables used when set: HAPTUNE_SERVER_URL (the server address built into the app) and
# REVENUECAT_ANDROID_KEY (RevenueCat's public Google Play key, so purchases work).
name: android
on:
  push:
    paths: ["web/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write          # to publish the "android-test" release with the APK

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      HAS_KEY: ${{ secrets.HAPTUNE_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm test
      - name: Build the web app
        run: npm run build
        env:
          HAPTUNE_SERVER: ${{ vars.HAPTUNE_SERVER_URL }}
          HAPTUNE_REVENUECAT_ANDROID: ${{ vars.REVENUECAT_ANDROID_KEY }}
          HAPTUNE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      - name: Copy it into the Android project
        run: npx cap sync android
      - name: Version
        id: v
        run: echo "name=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Build the test APK
        working-directory: web/android
        run: ./gradlew --no-daemon assembleDebug -PversionCode=${{ github.run_number }} -PversionName=${{ steps.v.outputs.name }}
      # The upload key is checked first, so a wrong secret gives a clear message (Gradle only says "keystore password
      # was incorrect", which is also what a damaged keystore file looks like). The test APK is still built and
      # published; the run turns red at the end.
      - name: Check the upload key (the four signing secrets)
        id: key
        if: env.HAS_KEY == 'true'
        env:
          KEY_B64: ${{ secrets.HAPTUNE_KEYSTORE_BASE64 }}
          SP0: ${{ secrets.HAPTUNE_KEYSTORE_PASSWORD }}
          ALIAS0: ${{ secrets.HAPTUNE_KEY_ALIAS }}
          KP0: ${{ secrets.HAPTUNE_KEY_PASSWORD }}
        run: |
          set +e
          ks="$RUNNER_TEMP/upload.jks"
          bad() { echo "::error title=Google Play signing::$1"; echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0; }
          trim() { printf '%s' "$1" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          # line breaks or spaces copied into the base64 text are dropped
          printf '%s' "$KEY_B64" | tr -d '\r\n\t ' | base64 -d > "$ks" 2>/dev/null
          [ "$(stat -c%s "$ks" 2>/dev/null || echo 0)" -gt 1000 ] || bad "HAPTUNE_KEYSTORE_BASE64 is not the base64 text of a .jks file (it is empty, cut short or not base64). Make haptune-upload.txt again (web/ANDROID.md §3) and paste all of it."
          echo "keystore file: $(stat -c%s "$ks") bytes, sha256 $(sha256sum "$ks" | cut -c1-16)…"
          opens() { keytool -list -keystore "$ks" -storepass "$1" >/dev/null 2>&1; }
          SP="$SP0"
          if ! opens "$SP"; then
            T="$(trim "$SP0")"
            if [ -n "$T" ] && [ "$T" != "$SP0" ] && opens "$T"; then
              echo "::add-mask::$T"; SP="$T"
              echo "::warning title=Google Play signing::HAPTUNE_KEYSTORE_PASSWORD had a space or line break at the start or end; it was used without it."
            else
              bad "HAPTUNE_KEYSTORE_PASSWORD does not open this keystore. Either it isn't the password you typed in keytool, or HAPTUNE_KEYSTORE_BASE64 is the text of a different .jks file. On your PC run: keytool -list -keystore haptune-upload.jks  (the password that works there goes in the secret; the file size should be $(stat -c%s "$ks") bytes)."
            fi
          fi
          ALIAS="$(trim "$ALIAS0")"
          if ! keytool -list -keystore "$ks" -storepass "$SP" -alias "$ALIAS" >/dev/null 2>&1; then
            have="$(keytool -list -v -keystore "$ks" -storepass "$SP" 2>/dev/null | sed -n 's/^Alias name: //p' | paste -sd, -)"
            bad "HAPTUNE_KEY_ALIAS '$ALIAS' is not in this keystore. It has: $have. Put that name in HAPTUNE_KEY_ALIAS."
          fi
          # the key's own password: new keystores (PKCS12, the default since Java 9) use the keystore password for the key
          if keytool -list -keystore "$ks" -storepass "$SP" 2>/dev/null | grep -qi "Keystore type: PKCS12"; then
            [ "$KP0" = "$SP0" ] || [ "$(trim "$KP0")" = "$SP" ] || echo "::warning title=Google Play signing::This keystore has one password for everything; HAPTUNE_KEY_PASSWORD differs from HAPTUNE_KEYSTORE_PASSWORD, so the keystore password was used. Set both secrets to the same value."
            KP0="$SP"
          fi
          keyok() { keytool -certreq -keystore "$ks" -storepass "$SP" -alias "$ALIAS" -keypass "$1" >/dev/null 2>&1; }
          KP="$KP0"
          if ! keyok "$KP"; then
            T="$(trim "$KP0")"
            if [ -n "$T" ] && keyok "$T"; then echo "::add-mask::$T"; KP="$T"; echo "::warning title=Google Play signing::HAPTUNE_KEY_PASSWORD had a space or line break at the start or end; it was used without it."
            elif keyok "$SP"; then KP="$SP"; echo "::warning title=Google Play signing::HAPTUNE_KEY_PASSWORD is wrong, but the keystore password opens the key, so that was used. Set HAPTUNE_KEY_PASSWORD to the same value as HAPTUNE_KEYSTORE_PASSWORD."
            else bad "HAPTUNE_KEY_PASSWORD does not open the key '$ALIAS'. For keystores made with a recent keytool it is the same as HAPTUNE_KEYSTORE_PASSWORD."
            fi
          fi
          echo "upload key certificate (public; Google Play shows the same under App integrity):"
          keytool -list -v -keystore "$ks" -storepass "$SP" -alias "$ALIAS" 2>/dev/null | grep -E "SHA1:|SHA256:" | sed 's/^[[:space:]]*/  /'
          { echo "HAPTUNE_KEYSTORE=$ks"; echo "HAPTUNE_KEYSTORE_PASSWORD<<__END__"; echo "$SP"; echo "__END__"; echo "HAPTUNE_KEY_ALIAS=$ALIAS"; echo "HAPTUNE_KEY_PASSWORD<<__END__"; echo "$KP"; echo "__END__"; } >> "$GITHUB_ENV"
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - name: Build the Google Play bundle (signed)
        if: steps.key.outputs.ok == 'true'
        working-directory: web/android
        run: ./gradlew --no-daemon bundleRelease -PversionCode=${{ github.run_number }} -PversionName=${{ steps.v.outputs.name }}
      - name: Collect files
        run: |
          mkdir -p ../out
          cp android/app/build/outputs/apk/debug/app-debug.apk ../out/Haptune.apk
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then cp android/app/build/outputs/bundle/release/app-release.aab ../out/Haptune.aab; fi
          ls -lh ../out
      - uses: actions/upload-artifact@v4
        with:
          name: Haptune-android
          path: out/
      - name: Publish the test APK (release "android-test")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-test --yes --cleanup-tag 2>/dev/null || true
          gh release create android-test ../out/Haptune.apk --prerelease --target "$GITHUB_SHA" \
            --title "Android test build ${{ steps.v.outputs.name }} (${{ github.run_number }})" \
            --notes "Newest test build from branch ${{ github.ref_name }}, commit ${GITHUB_SHA::7}. Download Haptune.apk on your Android phone and open it to install (allow installing from your browser if asked). (App ID com.sloky.melovyn: it installs next to older test builds that used another app ID, which you can delete.)"
      - name: Signing secrets need fixing (see the red note above)
        if: env.HAS_KEY == 'true' && steps.key.outputs.ok != 'true'
        run: |
          echo "The test APK was built and published, but Haptune.aab was not: fix the secret named in the error above, then run this workflow again."
          exit 1
