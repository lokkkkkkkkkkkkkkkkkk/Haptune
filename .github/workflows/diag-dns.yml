name: diag-dns (temporary)
on:
  push:
    branches: [diag/dns]
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - name: check
        run: |
          set +e
          D=haptune.name.my
          echo "== A"; dig +short A $D @1.1.1.1
          echo "== https"; curl -sS -m 20 -o /dev/null -w "%{http_code} %{ssl_verify_result}\n" https://$D/
          echo "== cert"; echo | openssl s_client -connect $D:443 -servername $D 2>/dev/null | openssl x509 -noout -subject -issuer -dates
          echo "== http"; curl -sS -m 20 -I http://$D/ | grep -iE "^HTTP|^server|^location"
          echo "== title"; curl -sS -m 20 http://$D/ | grep -o "<title>[^<]*"
          for f in robots.txt sitemap.xml teachers.html app/; do echo "== $f"; curl -sS -m 20 -o /dev/null -w "%{http_code}\n" http://$D/$f; done
          echo "== www"; curl -sS -m 20 -I http://www.$D/ | grep -iE "^HTTP|^location"
