name: diag-dns (temporary)
on:
  push:
    branches: [diag/dns]
jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get install -y -qq dnsutils whois >/dev/null 2>&1 || true
      - name: lookups
        run: |
          set +e
          D=haptune.name.my
          for R in 8.8.8.8 1.1.1.1; do
            echo "##### resolver $R"
            for T in NS SOA A AAAA; do echo "== $T $D"; dig +short @$R $T $D; done
            echo "== CNAME www"; dig +short @$R CNAME www.$D; dig +short @$R A www.$D
            echo "== full status"; dig @$R A $D | grep -E "status|flags"
          done
          echo "##### CAA / TXT / www"; for N in haptune.name.my name.my my; do echo "== CAA $N"; dig +short CAA $N @1.1.1.1; done; dig +short TXT haptune.name.my @1.1.1.1; dig +short www.haptune.name.my @1.1.1.1; dig +short CNAME www.haptune.name.my @1.1.1.1
          echo "== direct to cloudflare NS"; dig @lucy.ns.cloudflare.com A haptune.name.my +norec | grep -E "status|flags|^haptune"; dig @lucy.ns.cloudflare.com CAA haptune.name.my +norec | grep -E "status|CAA"; dig @lucy.ns.cloudflare.com AAAA haptune.name.my +norec | grep -E "status|AAAA"
          echo "== parent NS answers from every name.my server"; for S in $(dig +short NS name.my); do echo "-- $S"; dig @$S NS haptune.name.my +norec +time=3 +tries=1 | grep -E "status|IN.NS" ; done
          echo "== PSL check"; curl -s https://publicsuffix.org/list/public_suffix_list.dat | grep -nE "^(name|com)\.my$"
          echo "##### DS at parent (DNSSEC)"; dig +short DS $D @8.8.8.8
          echo "== NS of name.my"; dig +short NS name.my
          P=$(dig +short NS name.my | head -1); echo "== delegation from parent $P"; dig @$P NS $D +norec | sed -n '/AUTHORITY/,/^$/p;/ADDITIONAL/,/^$/p'
          echo "== DS from parent"; dig @$P DS $D +norec | grep -E "DS|status"
          echo "== cd (checking disabled) vs normal"; dig +cd @8.8.8.8 A $D | grep -E "status|^$D"; dig @8.8.8.8 A $D | grep status
          echo "##### trace"; dig +trace $D | tail -25
          echo "##### whois"; whois $D 2>&1 | head -40
          echo "##### http"; curl -sS -m 15 -I http://$D/ | head -8; curl -sS -m 15 -I https://$D/ | head -8
          echo "##### fly"; curl -sS -m 30 https://haptune-lok.fly.dev/health; echo
          curl -sS -m 30 -o /dev/null -D - -X OPTIONS https://haptune-lok.fly.dev/ai/status -H "Origin: http://haptune.name.my" -H "Access-Control-Request-Method: GET" | head -10
          curl -sS -m 30 -o /dev/null -D - -X OPTIONS https://haptune-lok.fly.dev/ai/status -H "Origin: https://haptune.name.my" -H "Access-Control-Request-Method: GET" | head -10
