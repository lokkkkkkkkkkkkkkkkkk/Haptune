# Builds the Haptune web app (web/) and publishes it to GitHub Pages.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
name: Web app (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          HAPTUNE_SERVER: ${{ vars.HAPTUNE_SERVER_URL }}   # the server address, built in so nobody types it
          HAPTUNE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}   # Sign in with Google (optional)
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist/pages
      # Optional: also publish to Cloudflare Pages (free, HTTPS on your own domain with no GitHub DNS check).
      # Set the secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (see HOSTING.md) to turn it on.
      - name: Publish to Cloudflare Pages (when set up)
        if: env.HAS_CF == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages deploy dist/pages --project-name=etasheet --branch=main --commit-dirty=true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
