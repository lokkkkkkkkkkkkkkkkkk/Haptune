# Tests the website and app on every change: unit tests, text check, then a click-through in a real browser at
# phone, tablet and computer sizes (find a song, play, 簡譜, edit, export, Stage, plans, a frozen sound system).
name: web-test
on:
  push:
    paths: ["web/**", "server/**", ".github/workflows/web-test.yml"]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: node tools/i18n-check.mjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      # the Classroom (teacher and student) against a real server on this machine
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Server for the Classroom walk-through
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libsndfile1
          pip install fastapi "uvicorn[standard]" python-multipart numpy scipy soundfile music21 mido verovio pymupdf pillow anthropic sqlalchemy httpx cryptography
      - run: npm run e2e:classroom
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: web/shots/
